<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onojk radio — live</title>
<meta name="description" content="onojk radio: a live internet radio station streaming music by Jonathan Kendall, around the clock.">
<meta property="og:title" content="onojk radio — live">
<meta property="og:description" content="A live stream of music by Jonathan Kendall.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/js/radio-player.js" defer></script>
<style>
  :root{
    --ink:#1a1814; --ink-soft:#4a4640; --ink-faint:#7d776c;
    --paper:#f6f2e9; --paper-deep:#efe9db; --line:#d9d1bf;
    --kink:#b2401f; --turn:#2f5d63; --maxw:44rem;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Spectral",Georgia,serif;font-size:1.18rem;line-height:1.72;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 1.5rem}
  header.masthead{padding:5rem 0 0;margin-bottom:2.5rem}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-faint);margin:0 0 1.4rem;}
  .eyebrow a{color:inherit;text-decoration:none}
  .eyebrow a:hover{color:var(--kink)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(3rem,9vw,5.5rem);
    line-height:.98;letter-spacing:-.02em;margin:0 0 1.2rem;}
  .standfirst{font-size:1.35rem;line-height:1.5;color:var(--ink-soft);font-style:italic;max-width:36rem;margin:0 0 2rem;}
  radio-player{
    --rp-accent:#c8552f; --rp-bg:var(--ink); --rp-fg:var(--paper);
    --rp-font:"IBM Plex Mono",ui-monospace,monospace; --rp-radius:10px;
    margin:0 0 2rem;
  }
  .credit{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.04em;
    color:var(--ink-faint);border-top:1px solid var(--line);padding-top:1.1rem;}
  .credit a{color:var(--turn);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  .credit a:hover{border-color:var(--turn)}
  footer{padding:3rem 0 4rem;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-faint)}
  footer a{color:var(--turn);text-decoration:none}
  @media (max-width:560px){ header.masthead{padding-top:3rem} .standfirst{font-size:1.15rem} }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="eyebrow"><a href="/">onojk123</a> · live</p>
    <h1>onojk radio</h1>
    <p class="standfirst">A live stream, always on. Press play and leave it running.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <radio-player src="https://radio.onojk123.com/stream" title="onojk radio"
      theme="dark" history="on" visualizer="lines"></radio-player>
    <p class="credit">Music by Jonathan Kendall · Player: <a href="https://github.com/onojk/tunein-embed">tunein-embed</a> (MIT)</p>
  </div>
</main>

<footer>
  <div class="wrap"><a href="/">← The Rig</a> · onojk123.com</div>
</footer>
</body>
</html>
